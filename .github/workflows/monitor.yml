name: Alerta Lush monitor

on:
  # Primary scheduler is now QStash hitting POST /api/cron/monitor every
  # 15 minutes. The cron below stays commented as an emergency fallback:
  # uncomment to re-enable GitHub Actions scheduling.
  # schedule:
  #   - cron: '3,18,33,48 * * * *'
  # Manual trigger for testing or recovery.
  workflow_dispatch:

# Never let two runs overlap (they would double-notify).
concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run monitoring pass
        run: npm run worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
