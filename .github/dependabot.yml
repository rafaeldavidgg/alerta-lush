version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    ignore:
      # typescript@latest only supports TS <6.1.0, so a TS 7 bump breaks
      # `npm ci` (and the Vercel build). Revisit when the ecosystem
      # supports TS 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
